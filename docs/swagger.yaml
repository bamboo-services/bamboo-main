        type: string
      expected_color_id:
        description: 预期展示颜色ID（修改申请待生效）
        type: integer
      expected_group_id:
        description: 预期展示位置ID（修改申请待生效）
        type: integer
      fail_reason:
        description: 友链失效原因
        type: string
      group_f_key:
        allOf:
        - $ref: '#/definitions/entity.LinkGroup'
        description: |-
          关联关系
          注意：constraint:"-" 跳过数据库外键约束——首页/友链页为内置分组（不落库），
          group_id 可能引用保留 ID，数据库层面需放行该引用值；分组关联的清理由业务层保证。
      group_id:
        description: 所属分组ID
        type: integer
      id:
        type: integer
      is_failure:
        description: 友链失效标志
        type: integer
      level:
        description: 友链级别
        type: integer
      name:
        description: 友链名称
        type: string
      review_remark:
        description: 审核备注
        type: string
      rss:
        description: 友链RSS地址
        type: string
      screenshot_at:
        description: 友链站点截图最近更新时间
        type: string
      screenshot_url:
        description: 友链站点截图URL（相对路径）
