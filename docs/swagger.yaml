definitions:
  apiAuth.ConfirmResetPasswordRequest:
    properties:
      new_password:
        example: newpassword123
        maxLength: 100
        minLength: 6
        type: string
      token:
        example: abc123...
        maxLength: 64
        minLength: 32
        type: string
    required:
    - new_password
    - token
    type: object
  apiAuth.LoginRequest:
    properties:
      password:
        example: password123
        maxLength: 100
        minLength: 6
        type: string
      username:
        example: admin
        maxLength: 50
        minLength: 1
        type: string
    required:
    - password
    - username
    type: object
  apiAuth.LoginResponse:
    properties:
      created_at:
        type: string
      expired_at:
        type: string
      token:
        type: string
      user:
        $ref: '#/definitions/entity.SystemUser'
    type: object
  apiAuth.PasswordChangeRequest:
    properties:
      new_password:
        example: newpassword123
        maxLength: 100
        minLength: 6
        type: string
      old_password:
        example: oldpassword123
        maxLength: 100
        minLength: 6
        type: string
    required:
    - new_password
    - old_password
    type: object
  apiAuth.PasswordResetRequest:
    properties:
      email:
        example: admin@example.com
        type: string
    required:
    - email
    type: object
  apiAuth.RegisterCodeRequest:
    properties:
      email:
        example: admin@example.com
        type: string
    required:
    - email
    type: object
  apiAuth.RegisterRequest:
    properties:
      code:
        example: "123456"
        type: string
      email:
        example: admin@example.com
        type: string
      nickname:
        example: 筱锋
        maxLength: 50
        minLength: 1
        type: string
      password:
        example: password123
        maxLength: 100
        minLength: 6
        type: string
      username:
        example: admin
        maxLength: 50
        minLength: 1
        type: string
    required:
    - code
    - email
    - password
    - username
    type: object
  apiAuth.RegisterResponse:
    properties:
      created_at:
        type: string
      expired_at:
        type: string
      token:
        type: string
      user:
        $ref: '#/definitions/entity.SystemUser'
    type: object
  apiAuth.UpdateProfileRequest:
    properties:
      avatar:
        example: https://example.com/avatar.jpg
        maxLength: 500
        type: string
      nickname:
        example: 筱锋
        maxLength: 50
        minLength: 1
        type: string
    type: object
  apiAuth.UserInfoResponse:
    properties:
      user:
        $ref: '#/definitions/entity.SystemUser'
    type: object
  apiDashboard.RecentApplicationItem:
    properties:
      avatar:
        description: 友链头像URL
        type: string
      created_at:
        description: 申请时间
        type: string
      id:
        description: 友链ID
        type: integer
      name:
        description: 友链名称
        type: string
      url:
        description: 友链URL地址
        type: string
    type: object
  apiDashboard.StatsResponse:
    properties:
      approved_links:
        description: 已通过友链数
        type: integer
      pending_links:
        description: 待审核友链数
        type: integer
      recent_applications:
        description: 最近友链申请列表
        items:
          $ref: '#/definitions/apiDashboard.RecentApplicationItem'
        type: array
      total_links:
        description: 友链总数
        type: integer
    type: object
  apiInfo.ApplySiteResponse:
    properties:
      email:
        type: string
      rss:
        type: string
      site_description:
        type: string
      site_image:
        type: string
      site_name:
        type: string
      site_url:
        type: string
      updated_at:
        type: string
    type: object
  apiInfo.ApplySiteUpdateRequest:
    properties:
      email:
        example: gm@x-lf.cn
        maxLength: 200
        type: string
      rss:
        example: https://blog.example.com/atom.xml
        maxLength: 500
        type: string
      site_description:
        example: 不为如何，只为在茫茫人海中有自己的一片天空~
        maxLength: 500
        type: string
      site_image:
        example: https://example.com/logo.png
        maxLength: 500
        type: string
      site_name:
        example: 凌中的锋雨
        maxLength: 100
        type: string
      site_url:
        example: https://www.x-lf.com
        maxLength: 500
        type: string
    type: object
  apiInfo.ArchiveResponse:
    properties:
      about:
        type: string
      site_description:
        type: string
      updated_at:
        type: string
    type: object
  apiInfo.ArchiveUpdateRequest:
    properties:
      about:
        example: |-
          # 关于我
          我是筱锋...
        maxLength: 10000
        type: string
      site_description:
        example: |-
          # 一个有趣的个人博客

          用 Markdown 书写本站介绍。
        maxLength: 5000
        type: string
    type: object
  apiInfo.BloggerResponse:
    properties:
      avatar:
        type: string
      blog_url:
        type: string
      description:
        type: string
      nick:
        type: string
      updated_at:
        type: string
    type: object
  apiInfo.BloggerUpdateRequest:
    properties:
      avatar:
        example: https://example.com/avatar.png
        maxLength: 500
        type: string
      blog_url:
        example: https://blog.x-lf.com
        maxLength: 500
        type: string
      description:
        example: 一个热爱技术的开发者，喜欢折腾各种有趣的东西。
        maxLength: 500
        type: string
      nick:
        example: 筱锋
        maxLength: 100
        type: string
    type: object
  apiInfo.BuiltinInvalidGroupResponse:
    properties:
      created_at:
        type: string
      description:
        description: 分组描述
        type: string
      id:
        type: integer
      links_f_key:
        description: |-
          关联关系
          注意：constraint:"-" 跳过数据库外键约束——「已失效」为内置分组（不落库），
          友链 group_id 会引用保留 ID，数据库层面需放行该引用值；分组关联的清理由业务层保证。
        items:
          $ref: '#/definitions/entity.LinkFriend'
        type: array
      name:
        description: 分组名称
        type: string
      sort_order:
        description: 分组排序
        type: integer
      status:
        description: 分组状态
        type: boolean
      updated_at:
        type: string
    type: object
  apiInfo.BuiltinInvalidGroupUpdateRequest:
    properties:
      description:
        description: 分组描述（空串清空）
        example: 已失效友链，站点不可访问
        maxLength: 500
        type: string
      name:
        description: 分组名称
        example: 已失效
        maxLength: 100
        minLength: 1
        type: string
    type: object
  apiInfo.SiteResponse:
    properties:
      introduction:
        type: string
      site_name:
        type: string
      updated_at:
        type: string
    type: object
  apiInfo.SiteUpdateRequest:
    properties:
      introduction:
        example: 欢迎来到我的主页！
        maxLength: 2000
        type: string
      site_name:
        example: 筱锋的小站
        maxLength: 100
        minLength: 1
        type: string
    type: object
  apiLink.ColorAddRequest:
    properties:
      color_name:
        description: 颜色名称
        example: 炫彩红
        maxLength: 50
        minLength: 1
        type: string
      color_order:
        description: 颜色排序
        example: 0
        minimum: 0
        type: integer
      hover_color:
        description: 悬停颜色
        example: '#FF3300'
        type: string
      primary_color:
        description: 主颜色
        example: '#FF0000'
        type: string
      sub_color:
        description: 副颜色
        example: '#FF6600'
        type: string
    required:
    - color_name
    type: object
  apiLink.ColorAddResponse:
    properties:
      created_at:
        type: string
      hover_color:
        description: 悬停颜色
        type: string
      id:
        type: integer
      links_f_key:
        description: |-
          关联关系
          注意：constraint:"-" 跳过数据库外键约束——炫彩为内置虚拟颜色（不落库），
          友链 color_id 会引用保留 ID，数据库层面需放行该引用值；关联清理由业务层保证。
        items:
          $ref: '#/definitions/entity.LinkFriend'
        type: array
      name:
        description: 颜色名称
        type: string
      primary_color:
        description: 主颜色
        type: string
      sort_order:
        description: 颜色排序
        type: integer
      status:
        description: 颜色状态
        type: boolean
      sub_color:
        description: 副颜色
        type: string
      updated_at:
        type: string
    type: object
  apiLink.ColorDeleteConflictInfo:
    properties:
      color_id:
        description: 颜色ID
        type: integer
      color_name:
        description: 颜色名称
        type: string
      display_count:
        description: 显示的友链数量（最多10个）
        type: integer
      total_links:
        description: 总友链数量
        type: integer
    type: object
  apiLink.ColorDeleteConflictResponse:
    properties:
      conflict_info:
        allOf:
        - $ref: '#/definitions/apiLink.ColorDeleteConflictInfo'
        description: 冲突信息
      links:
        description: 冲突的友链列表（前10个）
        items:
          $ref: '#/definitions/entity.LinkFriend'
        type: array
      message:
        description: 错误消息
        type: string
    type: object
  apiLink.ColorDetailResponse:
    properties:
      created_at:
        type: string
      hover_color:
        description: 悬停颜色
        type: string
      id:
        type: integer
      links_f_key:
        description: |-
          关联关系
          注意：constraint:"-" 跳过数据库外键约束——炫彩为内置虚拟颜色（不落库），
