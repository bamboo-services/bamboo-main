        items:
          $ref: '#/definitions/entity.LinkFriend'
        type: array
      name:
        description: 颜色名称
        type: string
      primary_color:
        description: 主颜色
        type: string
      sort_order:
        description: 颜色排序
        type: integer
      status:
        description: 颜色状态
        type: boolean
      sub_color:
        description: 副颜色
        type: string
      updated_at:
        type: string
    type: object
  apiLink.ColorPageResponse:
    properties:
      data:
        description: 数据列表
        items:
          $ref: '#/definitions/entity.LinkColor'
        type: array
      pagination:
        allOf:
        - $ref: '#/definitions/base.PaginationInfo'
        description: 分页信息
    type: object
  apiLink.ColorSortRequest:
    properties:
      color_ids:
        description: 颜色ID数组，按新的排序传入
        items:
          type: integer
        minItems: 1
        type: array
      sort_order:
        description: 可选的起始排序值，不填则从0开始递增
        example: 10
        minimum: 0
        type: integer
    required:
    - color_ids
    type: object
  apiLink.ColorSortResponse:
    properties:
      count:
        description: 更新的颜色数量
        type: integer
    type: object
  apiLink.ColorStatusRequest:
    properties:
      status:
        description: 状态：true=启用，false=禁用
        example: true
        type: boolean
    type: object
  apiLink.ColorStatusResponse:
    properties:
      status:
        description: 更新后的状态
        type: boolean
    type: object
  apiLink.ColorUpdateRequest:
    properties:
      color_name:
        description: 颜色名称
        example: 炫彩红
        maxLength: 50
        minLength: 1
        type: string
      color_order:
        description: 颜色排序
        example: 0
        minimum: 0
        type: integer
      hover_color:
        description: 悬停颜色（可传空字符串清空）
        example: '#FF3300'
        type: string
      primary_color:
        description: 主颜色（可传空字符串清空）
        example: '#FF0000'
        type: string
      sub_color:
        description: 副颜色（可传空字符串清空）
        example: '#FF6600'
        type: string
    type: object
  apiLink.ColorUpdateResponse:
    properties:
      created_at:
        type: string
      hover_color:
        description: 悬停颜色
        type: string
      id:
        type: integer
      links_f_key:
        description: |-
          关联关系
          注意：constraint:"-" 跳过数据库外键约束——炫彩为内置虚拟颜色（不落库），
          友链 color_id 会引用保留 ID，数据库层面需放行该引用值；关联清理由业务层保证。
        items:
          $ref: '#/definitions/entity.LinkFriend'
        type: array
      name:
        description: 颜色名称
        type: string
      primary_color:
        description: 主颜色
        type: string
      sort_order:
        description: 颜色排序
        type: integer
      status:
        description: 颜色状态
        type: boolean
      sub_color:
        description: 副颜色
        type: string
      updated_at:
        type: string
    type: object
  apiLink.FriendAddRequest:
    type: object
  apiLink.FriendAddResponse:
    properties:
      apply_remark:
        description: 申请者备注
        type: string
      avatar:
        description: 友链头像URL
        type: string
      color_f_key:
        allOf:
        - $ref: '#/definitions/entity.LinkColor'
        description: |-
          注意：constraint:"-" 跳过数据库外键约束——炫彩为内置虚拟颜色（不落库），
