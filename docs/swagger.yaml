      sort_order:
        description: 友链排序
        type: integer
      status:
        description: 友链状态
        type: integer
      updated_at:
        type: string
      url:
        description: 友链URL地址
        type: string
      user_f_key:
        allOf:
        - $ref: '#/definitions/entity.SystemUser'
        description: 归属用户外键
      user_id:
        description: 归属用户ID（按邮箱确认归属，为空表示游客提交尚未关联）
        type: integer
    type: object
  apiLink.FriendApplyRequest:
