  apiLink.FriendEditApplyRequest:
    type: object
  apiLink.FriendEditReviewRequest:
    properties:
      link_review_remark:
        example: 已调整
        maxLength: 500
        type: string
    type: object
  apiLink.FriendFailRequest:
    properties:
      link_fail:
        enum:
        - 0
        - 1
        example: 1
        type: integer
      link_fail_reason:
        example: 网站无法访问
        maxLength: 500
        type: string
    required:
    - link_fail
    type: object
  apiLink.FriendFailedResponse:
    properties:
      group:
        allOf:
        - $ref: '#/definitions/entity.LinkGroup'
