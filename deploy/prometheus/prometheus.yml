# Prometheus 抓取配置（开发环境）
# 抓取目标：宿主机上的 bamboo-main 后端 /metrics 端点。
# 容器内通过 host.docker.internal 访问宿主机服务。
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'bamboo-main'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['host.docker.internal:5555']
        labels:
          app: 'bamboo-main'
          env: 'development'
