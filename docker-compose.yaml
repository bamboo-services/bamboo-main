# docker-compose.yaml — 仅应用服务编排
#
# 默认连接外部已有的 PostgreSQL / Redis，适用于已有数据库/缓存基础设施的部署环境。
# 完整自包含编排（app + postgres + redis）见 docker-compose.full.yaml。
#
# 配置全部来自项目根目录 .env（env-first 约定，env_file 直接注入容器），
# 本文件仅覆盖容器内必须固定的项。.env 缺失时自动跳过（required: false）。
#
# 注意:
#   - .env 中的 DATABASE_HOST / NOSQL_HOST 若为 localhost，容器内无法连接宿主，
#     请改为宿主机可达地址（如 host.docker.internal）或 compose 服务名。
#   - 邮件为必需配置（startup 邮件节点 fail-fast），.env 需含 EMAIL_HOST / EMAIL_USER /
#     EMAIL_PASS / EMAIL_FROM，缺失则容器启动 panic 退出。
#
# 用法:
#   docker compose up -d --build
#   docker compose up -d --build -f docker-compose.full.yaml   # 全栈
name: bamboo-main

services:
  app:
    build:
      context: .
    image: ${DOCKER_HUB_USER:-bamboo-services}/bamboo-main:${VERSION:-latest}
    container_name: bamboo-main
    restart: unless-stopped
    # chromium 无头浏览器渲染需要较大共享内存，容器默认 /dev/shm 仅 64MB
    shm_size: 1gb
    # 引入项目 .env 作为容器环境变量（DATABASE_*/NOSQL_*/EMAIL_*/SSO_*/SCREENSHOT_* 等）
    env_file:
      - path: .env
        required: false
    environment:
      # 容器内固定监听地址（.env 的 XLF_HOST 保持原样注入，此处兜底为 0.0.0.0）
      XLF_HOST: "0.0.0.0"
      # 容器内固定浏览器路径（镜像已内置 chromium；显式兜底，防止 .env 空值覆盖触发 rod 自动下载不兼容浏览器）
      SCREENSHOT_CHROME_PATH: /usr/bin/chromium
      SCREENSHOT_DIR: data/screenshots
    ports:
      - "${XLF_PORT:-23333}:${XLF_PORT:-23333}"
    volumes:
      - ./data/screenshots:/app/data/screenshots
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:${XLF_PORT:-23333}/api/v1/public/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
