{{define "sponsor_rejected"}}
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
    <tr>
        <td style="padding-bottom: 18px;">
            <h2 style="margin: 0 0 18px; padding: 6px 0 6px 14px; border-left: 3px solid #4a7a55; font-family: Georgia, 'Songti SC', 'STSong', serif; font-size: 20px; font-weight: 600; color: #2f4a33; line-height: 1.4;">
                赞助展示申请审核结果
            </h2>
            <p style="margin: 0 0 12px; font-size: 15px; color: #5a6a52; line-height: 1.8;">
                亲爱的 <strong style="color: #2f4a33; font-weight: 600;">{{.Username}}</strong>，您好：
            </p>
            <p style="margin: 0; font-size: 15px; color: #5a6a52; line-height: 1.8;">
                很遗憾，您于竹林投递的赞助展示申请暂未能通过审核，相关信息如下：
            </p>
        </td>
    </tr>

    <tr>
        <td style="padding-bottom: 24px;">
            <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color: #f6f8f1; border: 1px solid #e2e8d8;">
                <tr>
                    <td style="padding: 11px 16px; border-bottom: 1px solid #e2e8d8; width: 32%; font-size: 13px; color: #7a8a72; letter-spacing: 0.5px;">署名</td>
                    <td style="padding: 11px 16px; border-bottom: 1px solid #e2e8d8; font-size: 14px; color: #2f4a33;">{{.Username}}</td>
                </tr>
                <tr>
                    <td style="padding: 11px 16px; border-bottom: 1px solid #e2e8d8; font-size: 13px; color: #7a8a72;">赞助金额</td>
                    <td style="padding: 11px 16px; border-bottom: 1px solid #e2e8d8; font-size: 14px; color: #2f4a33;">¥{{.Amount}}</td>
                </tr>
                <tr>
                    <td style="padding: 11px 16px; font-size: 13px; color: #7a8a72; vertical-align: top;">未过缘由</td>
                    <td style="padding: 11px 16px; font-size: 14px; color: #2f4a33; line-height: 1.7;">{{.RejectReason}}</td>
                </tr>
            </table>
        </td>
    </tr>

    <tr>
        <td>
            <p style="margin: 0; font-size: 15px; color: #6a7a62; line-height: 1.8;">
                若您对审核结果有疑问，可回复本邮件或联系站长沟通。期待未来仍有共沐晨光之机。
            </p>
        </td>
    </tr>
</table>
{{end}}
