{{define "email_verify"}}
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
    <tr>
        <td style="padding-bottom: 16px;">
            <h2 style="margin: 0 0 16px; font-size: 20px; font-weight: 600; color: #1a1a1a; border-bottom: 2px solid #9C27B0; padding-bottom: 10px;">
                ✉️ 验证您的邮箱地址
            </h2>
            <p style="margin: 0 0 12px; font-size: 15px; color: #555555; line-height: 1.8;">
                亲爱的 <strong style="color: #1a1a1a;">{{.Username}}</strong>，您好！
            </p>
            <p style="margin: 0; font-size: 15px; color: #555555; line-height: 1.8;">
                感谢您的注册！请点击下方按钮验证您的邮箱地址：
            </p>
        </td>
    </tr>
    <tr>
        <td align="center" style="padding: 12px 0 24px;">
            <a href="{{.VerifyLink}}" style="display: inline-block; padding: 14px 35px; background: #9C27B0; color: #ffffff; text-decoration: none; border-radius: 4px; font-size: 16px;">
                验证邮箱
            </a>
        </td>
    </tr>
    <tr>
        <td style="padding-bottom: 16px;">
            <p style="margin: 0 0 8px; font-size: 14px; color: #888888; line-height: 1.8;">
                如果按钮无法点击，请复制以下链接到浏览器打开：
            </p>
            <p style="margin: 0; color: #1a73e8; word-break: break-all; background: #f5f5f5; padding: 10px; border-radius: 4px; font-size: 12px;">
                {{.VerifyLink}}
            </p>
        </td>
    </tr>
    <tr>
        <td>
            <div style="background: #f3e5f5; border-left: 4px solid #9C27B0; padding: 15px; margin: 8px 0 0;">
                <p style="color: #7b1fa2; margin: 0; font-size: 14px;">
                    ⏰ 此链接将在 <strong>{{.ExpireTime}}</strong> 后失效。
                </p>
            </div>
        </td>
    </tr>
</table>
{{end}}
