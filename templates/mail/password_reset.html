{{define "password_reset"}}
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
    <tr>
        <td style="padding-bottom: 16px;">
            <h2 style="margin: 0 0 16px; font-size: 20px; font-weight: 600; color: #1a1a1a; border-bottom: 2px solid #FF9800; padding-bottom: 10px;">
                🔐 密码重置请求
            </h2>
            <p style="margin: 0 0 12px; font-size: 15px; color: #555555; line-height: 1.8;">
                亲爱的 <strong style="color: #1a1a1a;">{{.Username}}</strong>，您好！
            </p>
            <p style="margin: 0; font-size: 15px; color: #555555; line-height: 1.8;">
                我们收到了您的密码重置请求。请点击下方按钮重置您的密码：
            </p>
        </td>
    </tr>
    <tr>
        <td align="center" style="padding: 12px 0 24px;">
            <a href="{{.ResetLink}}" style="display: inline-block; padding: 14px 35px; background: #FF9800; color: #ffffff; text-decoration: none; border-radius: 4px; font-size: 16px;">
                重置密码
            </a>
        </td>
    </tr>
    <tr>
        <td style="padding-bottom: 16px;">
            <p style="margin: 0 0 8px; font-size: 14px; color: #888888; line-height: 1.8;">
                如果按钮无法点击，请复制以下链接到浏览器打开：
            </p>
            <p style="margin: 0; color: #1a73e8; word-break: break-all; background: #f5f5f5; padding: 10px; border-radius: 4px; font-size: 12px;">
                {{.ResetLink}}
            </p>
        </td>
    </tr>
    <tr>
        <td>
            <div style="background: #fff3e0; border-left: 4px solid #FF9800; padding: 15px; margin: 8px 0 0;">
                <p style="color: #e65100; margin: 0; font-size: 14px;">
                    ⚠️ 此链接将在 <strong>{{.ExpireTime}}</strong> 后失效。如非本人操作，请忽略此邮件。
                </p>
            </div>
        </td>
    </tr>
</table>
{{end}}
