{{define "password_reset"}}
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
    <tr>
        <td style="padding-bottom: 18px;">
            <h2 style="margin: 0 0 18px; padding: 6px 0 6px 14px; border-left: 3px solid #4a7a55; font-family: Georgia, 'Songti SC', 'STSong', serif; font-size: 20px; font-weight: 600; color: #2f4a33; line-height: 1.4;">
                密码重置请求
            </h2>
            <p style="margin: 0 0 12px; font-size: 15px; color: #5a6a52; line-height: 1.8;">
                亲爱的 <strong style="color: #2f4a33; font-weight: 600;">{{.Username}}</strong>，您好：
            </p>
            <p style="margin: 0; font-size: 15px; color: #5a6a52; line-height: 1.8;">
                竹林收到您的密码重置之请。请点击下方按钮以设新密：
            </p>
        </td>
    </tr>

    <tr>
        <td align="center" style="padding: 8px 0 24px;">
            <a href="{{.ResetLink}}" style="display: inline-block; padding: 14px 40px; background-color: #4a7a55; color: #ffffff; text-decoration: none; border-radius: 5px; font-family: Georgia, 'Songti SC', 'STSong', serif; font-size: 15px; letter-spacing: 2px; line-height: 1;">
                重置密码
            </a>
        </td>
    </tr>

    <tr>
        <td style="padding-bottom: 16px;">
            <p style="margin: 0 0 8px; font-size: 13px; color: #8a9a82; line-height: 1.7;">
                若按钮无法点按，可将以下链接誊录至浏览器开启：
            </p>
            <p style="margin: 0; padding: 10px 12px; background-color: #f1f4e8; border: 1px solid #e2e8d8; border-radius: 4px; font-size: 12px; color: #4a7a55; word-break: break-all; line-height: 1.6;">
                {{.ResetLink}}
            </p>
        </td>
    </tr>

    <tr>
        <td>
            <div style="margin: 8px 0 0; padding: 13px 16px; background-color: #f1f4e8; border-left: 3px solid #4a7a55; border-radius: 0 4px 4px 0;">
                <p style="margin: 0; font-size: 13px; color: #5a6a52; line-height: 1.7;">
                    此链接将于 <strong style="color: #2f4a33;">{{.ExpireTime}}</strong> 后失效。若非本人所请，请忽略此信，名帖安好如初。
                </p>
            </div>
        </td>
    </tr>
</table>
{{end}}
