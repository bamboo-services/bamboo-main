{{define "apply"}}
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
    <tr>
        <td style="padding-bottom: 16px;">
            <h2 style="margin: 0 0 16px; font-size: 20px; font-weight: 600; color: #1a1a1a; border-bottom: 2px solid #2196F3; padding-bottom: 10px;">
                📬 收到新的友链申请
            </h2>
            <p style="margin: 0 0 12px; font-size: 15px; color: #555555; line-height: 1.8;">
                管理员您好！
            </p>
            <p style="margin: 0; font-size: 15px; color: #555555; line-height: 1.8;">
                有用户提交了新的友情链接申请，请及时审核：
            </p>
        </td>
    </tr>
    <tr>
        <td style="padding-bottom: 24px;">
            <table style="width: 100%; border-collapse: collapse;">
                <tr>
                    <td style="padding: 12px; border: 1px solid #dddddd; background: #f9f9f9; width: 30%; font-size: 14px; color: #555555;">申请人</td>
                    <td style="padding: 12px; border: 1px solid #dddddd; font-size: 14px; color: #333333;">{{.Username}}</td>
                </tr>
                <tr>
                    <td style="padding: 12px; border: 1px solid #dddddd; background: #f9f9f9; font-size: 14px; color: #555555;">网站名称</td>
                    <td style="padding: 12px; border: 1px solid #dddddd; font-size: 14px; color: #333333;">{{.LinkName}}</td>
                </tr>
                <tr>
                    <td style="padding: 12px; border: 1px solid #dddddd; background: #f9f9f9; font-size: 14px; color: #555555;">网站地址</td>
                    <td style="padding: 12px; border: 1px solid #dddddd; font-size: 14px;">
                        <a href="{{.LinkURL}}" style="color: #1a73e8;">{{.LinkURL}}</a>
                    </td>
                </tr>
                <tr>
                    <td style="padding: 12px; border: 1px solid #dddddd; background: #f9f9f9; font-size: 14px; color: #555555;">网站描述</td>
                    <td style="padding: 12px; border: 1px solid #dddddd; font-size: 14px; color: #333333;">{{.LinkDesc}}</td>
                </tr>
                <tr>
                    <td style="padding: 12px; border: 1px solid #dddddd; background: #f9f9f9; font-size: 14px; color: #555555;">联系邮箱</td>
                    <td style="padding: 12px; border: 1px solid #dddddd; font-size: 14px; color: #333333;">{{.Email}}</td>
                </tr>
            </table>
        </td>
    </tr>
    <tr>
        <td align="center">
            <a href="{{.AdminURL}}" style="display: inline-block; padding: 12px 30px; background: #2196F3; color: #ffffff; text-decoration: none; border-radius: 4px;">
                前往管理后台审核
            </a>
        </td>
    </tr>
</table>
{{end}}
