# docker-compose.full.yaml — 全栈编排（应用 + PostgreSQL + Redis）
#
# 一条命令拉起完整环境，适用于本地开发 / 测试 / 演示。仅应用服务的部署编排见 docker-compose.yaml。
#
# 配置同样来自项目根目录 .env（env_file 直接注入容器），本文件仅覆盖：
#   - DATABASE_HOST / NOSQL_HOST 指向 compose 内部服务名（覆盖 .env 中的 localhost）
#   - 容器内固定路径（chromium / 模板 / 截图目录）
# .env 缺失时自动跳过（required: false）。
#
# 注意:
#   - 邮件为必需配置（startup 邮件节点 fail-fast），.env 需含 EMAIL_HOST / EMAIL_USER /
#     EMAIL_PASS / EMAIL_FROM，缺失则容器启动 panic 退出。
#   - .env 中的 XLF_PORT 决定对外映射端口（默认 23333）。
#
# 用法:
#   docker compose -f docker-compose.full.yaml up -d --build
#   docker compose -f docker-compose.full.yaml down -v   # 连同数据卷一并清理
name: bamboo-main-full

services:
  postgres:
    image: postgres:16-alpine
    container_name: bamboo-main-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DATABASE_USER:-bamboo_main}
      POSTGRES_PASSWORD: ${DATABASE_PASS:-bamboo_main}
      POSTGRES_DB: ${DATABASE_NAME:-bamboo_main}
      TZ: Asia/Shanghai
    ports:
      - "${DATABASE_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USER:-bamboo_main} -d ${DATABASE_NAME:-bamboo_main}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: bamboo-main-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${NOSQL_PORT:-6379}:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
    image: ${DOCKER_HUB_USER:-bamboo-services}/bamboo-main:${VERSION:-latest}
    container_name: bamboo-main
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    # chromium 无头浏览器渲染需要较大共享内存，容器默认 /dev/shm 仅 64MB
    shm_size: 1gb
    # 引入项目 .env 作为容器环境变量（DATABASE_*/NOSQL_*/EMAIL_*/SSO_*/SCREENSHOT_* 等）
    env_file:
      - path: .env
        required: false
    environment:
      # 覆盖为 compose 内部服务名（env_file 注入的 localhost 会被此处覆盖）
      DATABASE_HOST: postgres
      NOSQL_HOST: redis
      # 容器内固定监听地址
      XLF_HOST: "0.0.0.0"
      # 容器内固定路径（镜像已内置，此处显式兜底）
      SCREENSHOT_CHROME_PATH: /usr/bin/chromium
      SCREENSHOT_DIR: data/screenshots
      # 邮件模板已 go:embed 内嵌；显式置空，防止 .env 残留 EMAIL_TEMPLATE_DIR 触发 xEmail 加载外部目录失败
      EMAIL_TEMPLATE_DIR: ""
    ports:
      - "${XLF_PORT:-23333}:${XLF_PORT:-23333}"
    volumes:
      - screenshots:/app/data/screenshots
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:${XLF_PORT:-23333}/api/v1/public/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  pgdata:
  redisdata:
  screenshots:
